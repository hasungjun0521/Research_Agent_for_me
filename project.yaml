operating_rules:
  communication: "Agents communicate through files."
  evidence: "Every research claim must connect to evidence and uncertainty."
  updates: "Agents update only files named in their prompt or workflow step."
  filesystem_safety: "Never delete, move, overwrite, clean, or recursively remove any directory outside the active project folder. For harness maintenance, stay inside this repository and touch only requested files. Destructive commands such as rm -rf, find -delete, git clean -fd, rsync --delete, or shutil.rmtree must not target paths outside the active folder."
  automation: "Claude/Codex native sessions plus file-based state are the default workflow; browser dashboard and legacy loops are optional support paths."
  dashboard_optional: "Dashboard support is parked/optional. Default smoke, release, and verify gates do not enforce dashboard JavaScript/API/command-runner checks unless --include-dashboard is passed."
  agent_status: "For every agent pass, state/agent_status.json is in scope: update the existing agent entry to running before work, heartbeat during long work, and done/waiting/blocked/idle when finished."
  status_cli: "Do not hand-edit harness JSON. Use scripts/commands/agents/agent_status.py, scripts/commands/agents/agent_messages.py, scripts/commands/agents/agent_orchestrator.py, scripts/commands/review/command_queue.py, scripts/commands/review/progress_checkpoint.py, scripts/commands/projects/state_doctor.py, scripts/commands/projects/project_health.py, scripts/commands/projects/brief_intake.py, scripts/commands/research/research_loop.py, scripts/commands/review/loop_summary.py, scripts/commands/experiments/run_state.py, scripts/commands/experiments/experiment_complete.py, scripts/commands/experiments/experiment_planner.py, scripts/commands/experiments/gpu_scheduler.py, scripts/commands/experiments/gpu_monitor.py, scripts/commands/experiments/result_ingest.py, scripts/commands/research/research_registry.py, scripts/commands/research/phase_gate.py, scripts/commands/reports/resource_ledger.py, scripts/commands/reports/claim_graph.py, scripts/commands/baselines/baseline_library.py, scripts/commands/baselines/baseline_intake.py, scripts/commands/baselines/baseline_compare.py, scripts/commands/baselines/repo_discovery.py, scripts/commands/baselines/baseline_sandbox.py, scripts/commands/projects/create_project.py, scripts/commands/projects/project_intake.py, scripts/commands/projects/import_research_repo.py, scripts/commands/projects/migrate_project.py, scripts/commands/projects/project_resume.py, scripts/commands/projects/project_closeout.py, scripts/commands/review/review_forms.py, scripts/commands/review/agent_quality_audit.py, scripts/commands/reports/artifact_packager.py, and scripts/commands/projects/validate_project.py."
  progress_capture: "Do not wait until final response to persist research progress. When results, blockers, direction changes, failed assumptions, experiment outcomes, memory notes, or next actions appear, use scripts/commands/review/progress_checkpoint.py to update current_state, agent_memory, next_actions, open_questions, status/events, run logs, or the relevant evidence artifact in the same pass."
  state_health: "Use scripts/commands/projects/state_doctor.py and scripts/commands/projects/project_health.py when dashboard-free state inspection is needed. state_doctor identifies stale or inconsistent file state; project_health writes state/project_health.md as the plain-language dashboard replacement. Refresh state_doctor first and project_health second. Preview state_doctor repairs with --dry-run-repair before writing missing starter files unless the user explicitly asks to apply immediately. Repair may create only safe starter files or template-backed continuity files; it must not invent research content. State doctor reports repair_mode, repaired_count, repaired files, and repair_errors, and template-backed JSON repairs must validate before write. When command_queue.json or next_actions.md is restored, sync the human-readable next_actions mirror from the structured queue. When findings should become routed work, preview suggested command entries first and then enqueue through these CLIs instead of hand-editing state/command_queue.json."
  brief_intake: "Use scripts/commands/projects/brief_intake.py when a rough idea needs to become a durable research brief without asking the user to run Python directly."
  experiment_planning: "Use scripts/commands/experiments/experiment_planner.py to create smoke-first experiment DAGs, identify parallel main runs, and preserve expected outputs/check procedures before GPU dispatch."
  claim_graph: "Use scripts/commands/reports/claim_graph.py to connect working claims, experiment rows, journal analysis, baselines, and evidence before strengthening paper claims."
  baseline_compare: "Use scripts/commands/baselines/baseline_compare.py after baseline source snapshots exist to compare repo structure and update the project-side code structure plan."
  agent_quality_audit: "Use scripts/commands/review/agent_quality_audit.py to check whether completed agent work left enough output-file evidence, checkpoints, and experiment analysis for a fresh session to resume."
  agent_events: "Agent lifecycle changes append to state/agent_events.jsonl for timeline and performance analysis; inspect it with scripts/commands/agents/agent_events.py."
  voting_gate: "High-risk or important commands can require multi-agent voting through state/agent_votes.json and scripts/commands/agents/agent_vote.py; scripts/commands/agents/agent_orchestrator.py refuses dispatch until the linked vote is approved."
  proactive_multi_agent: "Do not wait for the user to explicitly request multi-agent work when a task is deep, broad, or naturally parallel. Identify the local critical path first, then use agent_orchestrator status-parallel/parallel/run-prepared or leader_dispatch to route independent sidecar work with clear dependencies, owners, and expected outputs. Do not parallelize unresolved dependencies, shared write paths, unapproved vote gates, or vague done conditions."
  parallel_agents: "When several open commands are independent, use scripts/commands/agents/agent_orchestrator.py status-parallel for a read-only view, then use scripts/commands/agents/agent_orchestrator.py parallel to plan or dispatch different owner agents concurrently. Use next --json when another agent needs the serial fallback plus open_parallel_diagnostics, and use parallel --json when another agent needs open_parallel_diagnostics beside the planned command list. Use depends_on and parallel_group in state/command_queue.json to make safe batches explicit, and do not parallelize commands with path conflicts or unapproved vote gates. Explicit parallel --id requests must fail with a concrete reason instead of silently skipping unsafe commands. When prompts were already written and commands are in progress, inspect them with scripts/commands/agents/agent_orchestrator.py run-prepared --dry-run, then use run-prepared with --group or explicit --id values and the configured runner command. run-prepared must fail rather than launch scoped prepared prompts whose depends_on entries are not done. Use --all-prepared only when intentionally running every prepared prompt across groups. After reviewing worker outputs, use scripts/commands/agents/agent_orchestrator.py finish-parallel to close the scoped prepared batch."
  session_workspaces: "Use scripts/commands/review/session_state.py to create state/sessions/<session_id>/ workspaces for loop-local scratchpads, plans, results, and artifacts."
  pattern_memory: "Record reusable project-local lessons in state/pattern_memory.json through scripts/commands/review/pattern_memory.py so later agents can search proven triggers, recommendations, and evidence."
  ralph_loop: "Legacy optional path only. Use scripts/commands/review/ralph_loop.py only when a human explicitly asks for bounded Ralph-loop behavior; otherwise prefer native Claude/Codex sessions plus command_queue, status, messages, session workspaces, and loop_summary."
  loop_summary: "At the start and end of each research loop, update state/loop_summary.json with scripts/commands/review/loop_summary.py so file-based state shows what changed, the result, completed commands, and next actions."
  handoff_scope: "Use the repository root HANDOFF.md for harness maintenance and each projects/<name>/HANDOFF.md for project-local research continuity."
  human_readable_next_actions: "Command and loop next actions should explain the work, reason, and done condition in prose; file paths are traceability outputs, not the primary explanation."
  reader_report: "09_report/ is the final reader-facing and release-facing artifact folder. Keep active research code in 04_code/ and working analysis/results in 05_results/; export to 09_report/ only when stable enough to share."
  report_index: "scripts/commands/reports/report_index.py maintains only the final 09_report/README.md artifact index. Routine command/status/GPU/progress updates refresh workflow support surfaces without touching 09_report unless a final/report-facing writer opts in with include_report=True."
  research_rigor: "Experiment-backed claims require preregistration before execution, reproducibility manifest during execution, statistical robustness during analysis, and reviewer attack matrix before claim strengthening."
  research_registry: "Datasets and metrics used in final result rows must be registered in 03_experiments/dataset_registry.json and 03_experiments/metric_registry.json through scripts/commands/research/research_registry.py."
  project_import_migration: "Create/import/migrate projects through scripts/commands/projects/create_project.py, import_research_repo.py, and migrate_project.py so project_created, import_research_repo, and project_migration lifecycle events are recorded."
  resource_and_phase_tracking: "Track research phase gates with scripts/commands/research/phase_gate.py and resource usage with scripts/commands/reports/resource_ledger.py before claiming a project is ready or compute costs are understood."
  artifact_packaging: "Create reproducibility manifests and archives with scripts/commands/reports/artifact_packager.py so final packages record artifact_packager lifecycle outputs and include required working evidence such as data_roots, artifact_registry, experiment_results, experiment_journal, and terminology."
  research_loop: "Use scripts/commands/research/research_loop.py to plan or enqueue the next agent actions from current project evidence gaps; it writes command_queue and agent_messages rather than hidden state."
  agent_messages: "Agents send questions, handoffs, reviews, blockers, and decisions through state/agent_messages.json with scripts/commands/agents/agent_messages.py; unresolved high-priority blockers prevent strict validation."
  gpu_experiments: "Queue independent GPU jobs before dispatch, then plan, launch, monitor, and update only through scripts/commands/experiments/gpu_scheduler.py and scripts/commands/experiments/gpu_monitor.py; keep active usage at or below the configured workspace/project GPU cap."
  gpu_parallel_scheduler: "Use scripts/commands/experiments/gpu_scheduler.py to queue all independent launchable jobs first and dispatch parallel batches by default so idle GPUs are used within max_user_gpus. Use list --json for GPU job dependency readiness, plan --json with plan_diagnostics, and dispatch --json for dry-run selected_jobs plus launch_commands before reducing the batch. Use refresh --json for lifecycle diagnostics and refresh --write to sync scheduler-visible terminal states into gpu_experiment_queue and run_state. Explicit dispatch --ids requests should fail with dependency or capacity diagnostics when a requested job is not dispatchable. The scheduler reads configured queue/node status commands, records gpu_dispatch_plan before executed dispatches, and requires --execute before submitting sbatch jobs."
  agent_runner_profiles: "External agent execution can use config/workspace_profile.local.json agent_runners profiles. agent_orchestrator dispatch, parallel, and run-prepared accept --runner-profile or fall back to agent_runners.default_profile when --execute needs a non-interactive runner."
  experiment_results: "Use scripts/commands/experiments/experiment_complete.py, scripts/commands/experiments/result_ingest.py, and scripts/commands/review/progress_checkpoint.py to keep 05_results/experiment_results.csv, 05_results/experiment_journal.md, 05_results/experiment_journal.csv, 05_results/statistical_robustness.md, 03_experiments/artifact_registry.csv, and 03_experiments/<exp_id>/analysis.md current after every completed experiment. Add --final-export only when result or robustness rows are stable enough for 09_report/results/."
  claim_board: "Use scripts/commands/reports/claim_evidence_board.py build --write for the working board in 05_results/claim_evidence_board.md. Add --final-export only when the board is stable enough for 09_report/results/claim_evidence_board.csv."
  baseline_library: "Before implementing or comparing baselines, read 08_baselines/, register sources and commands with scripts/commands/baselines/baseline_library.py, run scripts/commands/baselines/baseline_sandbox.py before executing cloned code, and record adaptation notes before claiming reproducibility."
  baseline_intake: "When baseline papers or repo URLs are provided, use scripts/commands/baselines/baseline_intake.py and scripts/commands/baselines/repo_discovery.py to register papers, resolve repo URLs, clone source repos into 08_baselines/source_snapshots/, inspect structure, scaffold thin adapters and smoke scripts, and update 08_baselines/code_structure_plan.md before structuring 04_code/src/."
  project_skills: "Use prompts/skills/ to reduce context, speed up repeated workflows, and standardize GPU parallelization, baseline intake, smoke-first experiments, and claim compression."
  venue_review_forms: "When reviewing papers by venue criteria, select the exact venue/year form from review_forms/form_registry.json, create outputs under 07_reviews/form_reviews/, and fill every required form field with evidence."

